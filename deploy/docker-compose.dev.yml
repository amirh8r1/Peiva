services:
  frontend-dev:
    image: node:22-alpine
    container_name: jahad-frontend-dev
    working_dir: /app
    command: sh -c "npm install --no-audit && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - jahad-network

networks:
  jahad-network:
    driver: bridge
